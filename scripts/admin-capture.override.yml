# Local demonstration only. Unique containers/volumes, loopback ports, no SMTP.
# Read-only source compose is paired with this override; no source file is edited.
services:
  postgres:
    container_name: zawedni-story-capture-db
    ports: !override
      - '127.0.0.1:6062:5432'
  backend:
    container_name: zawedni-story-capture-api
    ports: !override
      - '127.0.0.1:6060:8080'
    environment:
      SPRING_MAIL_HOST: '127.0.0.1'
      SPRING_MAIL_PORT: '9'
  zawedni-admin:
    container_name: zawedni-story-capture-admin
    ports: !override
      - '127.0.0.1:6064:80'
